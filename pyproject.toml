[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aliensilicon"
version = "0.0.1"
description = "Tile IR, interpreter, cost model and judge for AI kernels on unseen chips"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
keywords = ["gpu", "kernels", "compiler", "ai-agents", "benchmark", "hardware-design", "tilelang", "formal-verification"]
dependencies = ["numpy>=1.26", "jsonschema>=4.20", "z3-solver>=4.12"]

[project.scripts]
aliensilicon = "aliensilicon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["aliensilicon*", "judge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports; __all__ is built from DSL_NAMES
# Symbolic dims like ("rows", "cols") inside GMEM[...] annotations look like forward refs to ruff.
"tests/**" = ["F821", "F841", "B018", "E741"]
"aliensilicon/tasks/baselines/**" = ["F821", "E741"]  # Q, K, V, O, l as in the math
